# Pushing a tag like v1.0.0 builds the installer and the extension packages, and publishes
# them as a GitHub release with their SHA-256 checksums (M11, ADR-0019).
# Actions are pinned to full commit SHAs (the tag is in the comment), so a moved tag can't
# change what runs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: The tag must match SDM's version
        shell: pwsh
        run: |
          $version = uv run python -c "import importlib.metadata as m; print(m.version('sdm'))"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match SDM's version $version (pyproject.toml)"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: uv run pytest -q -p no:cacheprovider
      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: uv run python scripts/build_release.py --installer
      - run: uv run python scripts/build_extensions.py
      - name: Collect the files and their checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/release | Out-Null
          Copy-Item "dist/SDM-Setup-$env:VERSION.exe" dist/release/
          Compress-Archive -Path dist/SDM -DestinationPath "dist/release/SDM-$env:VERSION-portable.zip"
          # Only the Chromium zip: Edge and Firefox users get the extension from their stores
          # (ADR-0019); build_extensions.py makes the store zips for the owner to submit.
          Copy-Item "dist/extension/sdm-chromium-$env:VERSION.zip" dist/release/
          $sums = Get-ChildItem dist/release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Set-Content -Encoding utf8 dist/release/SHA256SUMS.txt
          Get-Content packaging/release-notes.md | Set-Content -Encoding utf8 dist/notes.md
          Add-Content -Encoding utf8 dist/notes.md "", "## SHA-256 checksums", "", '```'
          Add-Content -Encoding utf8 dist/notes.md $sums
          Add-Content -Encoding utf8 dist/notes.md '```'
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release).FullName `
            --title "SDM $env:VERSION" --notes-file dist/notes.md

[project]
name = "sdm"
version = "1.2.0"
description = "SDM (Smart Download Manager): a free, open-source download manager for Windows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Conditions-tech" }]
keywords = ["download manager", "downloader", "segmented downloads", "browser extension"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "aiohttp>=3.14.5",
    "pyside6-essentials>=6.12.0",
]

[project.gui-scripts]
sdm = "sdm.app:main"

[project.scripts]
sdm-get = "sdm.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
# uv's cache is on C: and the project on D:; hardlinks can't cross drives, so copy.
link-mode = "copy"

[tool.ruff]
line-length = 100
# Lint against our minimum supported Python, not the newer one we develop on.
target-version = "py312"

[tool.ruff.lint]
# E/W: style, F: likely bugs, I: import order, B: common bug patterns,
# UP: modern syntax available in 3.12, S: security checks (bandit rules).
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses plain assert statements
    "S104",  # tests use addresses like "0.0.0.0" as data to block, not to listen on
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
qt_api = "pyside6"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
]
